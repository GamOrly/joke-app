<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיחה בלחיצה</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-pink: #FFE8EC;
      --hint: #756B92;
      --ui-font: "Fredoka", system-ui, sans-serif;
      --joke-font: "Playpen Sans Hebrew", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--sun);
      background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
      background-repeat: no-repeat, repeat;
      background-position: top center, 0 0;
      background-size: 440px auto, 16px 16px;
      color: var(--ink);
      font-family: var(--ui-font);
      font-weight: 500;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .logo {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .intro {
      margin: 0;
      text-align: center;
      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: -6px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 12px 16px;
      transform: rotate(0.6deg);
    }

    input::placeholder { color: var(--hint); opacity: 1; }

    input:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 2px;
    }

    .go {
      min-height: 64px;
      width: 100%;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      margin-bottom: 8px;
      cursor: pointer;
      transform: rotate(-1deg);
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .go:active,
    .go:disabled {
      transform: rotate(-1deg) translateY(6px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .go:disabled { cursor: wait; }

    .go:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    .bubble {
      min-height: 190px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .mascot {
      width: 118px;
      height: auto;
      animation: bob 2.4s ease-in-out infinite;
    }

    .message {
      margin: 0;
      font-size: 17px;
      color: var(--ink-soft);
    }

    .message.joke {
      font-family: var(--joke-font);
      font-size: 25px;
      line-height: 1.55;
      color: var(--ink);
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      padding: 8px 18px 18px;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 style="margin:0">
      <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה" width="360" height="190">
    </h1>
    <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="joke-form">
      <label for="topic">על מה הבדיחה?</label>
      <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
      <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle">
      <img class="mascot" src="assets/mascot-idle.svg" alt="הדמות מחייכת" width="120" height="112">
      <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    </section>
  </main>

  <footer>מיישם AI ואוטומציה · 53500</footer>

  <script>
    const form = document.getElementById("joke-form");
    const topicInput = document.getElementById("topic");
    const button = document.getElementById("go");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;

      try {
        const response = await fetch("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: topicInput.value.trim() }),
        });
        const data = await response.json();
        message.textContent = data.joke || data.error || "משהו השתבש. נסו שוב.";
        message.classList.toggle("joke", Boolean(data.joke));
      } catch {
        message.textContent = "אין חיבור לשרת. נסו שוב.";
        message.classList.remove("joke");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
