<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיחה בלחיצה</title>
  <meta name="theme-color" content="#FFE15A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-pink: #FFE8EC;
      --hint: #756B92;
      --mint: #1FCB8C;
      --ui-font: "Fredoka", system-ui, sans-serif;
      --joke-font: "Playpen Sans Hebrew", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--sun);
      background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
      background-repeat: no-repeat, repeat;
      background-position: top center, 0 0;
      background-size: 440px auto, 16px 16px;
      color: var(--ink);
      font-family: var(--ui-font);
      font-weight: 500;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .logo {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .intro {
      margin: 0;
      text-align: center;
      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: -6px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 12px 16px;
      transform: rotate(0.6deg);
    }

    input::placeholder { color: var(--hint); opacity: 1; }

    input:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 2px;
    }

    .go {
      min-height: 64px;
      width: 100%;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      margin-bottom: 8px;
      cursor: pointer;
      transform: rotate(-1deg);
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .go:active,
    .go:disabled {
      transform: rotate(-1deg) translateY(6px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .go:disabled { cursor: wait; }

    .go:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    .bubble {
      position: relative;
      min-height: 190px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .mascot {
      width: 118px;
      height: auto;
      animation: bob 2.4s ease-in-out infinite;
    }

    .message {
      margin: 0;
      font-size: 17px;
      color: var(--ink-soft);
    }

    /* טעינה: הדמות נמעכת ומשתחררת */
    .bubble[data-state="think"] .mascot {
      transform-origin: bottom center;
      animation: squish 0.5s ease-in-out infinite alternate;
    }

    /* בדיחה: הדמות בפינה הימנית העליונה, חצי בחוץ, והבדיחה בכתב יד */
    .bubble[data-state="joke"] {
      padding-top: 34px;
    }

    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -44px;
      right: -14px;
      width: 86px;
      transform: rotate(8deg);
      animation: laugh 0.45s ease-in-out 4;
    }

    .bubble[data-state="joke"] .message {
      font-family: var(--joke-font);
      font-size: 25px;
      line-height: 1.55;
      color: var(--ink);
    }

    /* שגיאה: רקע ורדרד, הודעה באדום, והדמות מתנדנדת */
    .bubble[data-state="error"] {
      background: var(--error-pink);
    }

    .bubble[data-state="error"] .mascot {
      animation: wobble 0.6s ease-in-out 2;
    }

    .bubble[data-state="error"] .message {
      color: var(--error);
      font-weight: 600;
    }

    /* "צחקתי": גלולה קטנה בבועה. אחרי לחיצה: מנטה, לחוצה ונעולה */
    .laugh {
      min-height: 44px;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 6px 20px;
      cursor: pointer;
      transform: rotate(1deg);
      transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
    }

    .laugh:active,
    .laugh:disabled {
      transform: rotate(1deg) translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .laugh:disabled { cursor: default; }
    .laugh.done { background: var(--mint); }

    .laugh:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 3px;
    }

    .laugh-error {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--error);
    }

    [hidden] { display: none !important; }

    /* "הכי מצחיקות" */
    .top {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .top ol {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      counter-reset: top;
    }

    .top li {
      counter-increment: top;
      position: relative;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 14px 52px 12px 16px;
      transform: rotate(0.6deg);
    }

    .top li:nth-child(even) { transform: rotate(-0.6deg); }

    .top li::before {
      content: counter(top);
      position: absolute;
      top: 12px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--sun);
      border: 2px solid var(--ink);
      font-weight: 700;
      font-size: 16px;
      line-height: 26px;
      text-align: center;
    }

    .top-text {
      margin: 0;
      font-family: var(--joke-font);
      font-size: 18px;
      line-height: 1.55;
    }

    .top-meta {
      margin: 6px 0 0;
      font-size: 15px;
      color: var(--ink-soft);
    }

    .top-status {
      margin: 0;
      font-size: 17px;
      color: var(--ink-soft);
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      padding: 8px 18px 18px;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes squish {
      from { transform: scale(1, 1); }
      to { transform: scale(1.08, 0.86); }
    }

    @keyframes laugh {
      0%, 100% { transform: rotate(8deg); }
      25% { transform: rotate(-6deg) translateY(-3px); }
      75% { transform: rotate(16deg) translateY(-3px); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 style="margin:0">
      <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה" width="360" height="190">
    </h1>
    <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="joke-form">
      <label for="topic">על מה הבדיחה?</label>
      <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
      <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle">
      <img class="mascot" id="mascot" src="assets/mascot-idle.svg" alt="הדמות מחייכת" width="120" height="112">
      <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
      <button class="laugh" id="laugh" type="button" hidden>צחקתי · 0</button>
      <p class="laugh-error" id="laugh-error" role="alert" hidden></p>
    </section>

    <section class="top" aria-labelledby="top-title">
      <h2 id="top-title">הכי מצחיקות</h2>
      <ol id="top-list" aria-live="polite"></ol>
      <p class="top-status" id="top-status">טוען...</p>
    </section>
  </main>

  <footer>מיישם AI ואוטומציה · 53500</footer>

  <script>
    const form = document.getElementById("joke-form");
    const topicInput = document.getElementById("topic");
    const button = document.getElementById("go");
    const message = document.getElementById("message");
    const bubble = document.getElementById("bubble");
    const mascot = document.getElementById("mascot");

    // לכל מצב: ציור הדמות, תיאור לקורא מסך, וטקסט הכפתור
    const STATES = {
      idle: { src: "assets/mascot-idle.svg", alt: "הדמות מחייכת", button: "תנו לי בדיחה!" },
      think: { src: "assets/mascot-think.svg", alt: "הדמות חושבת", button: "חושב..." },
      joke: { src: "assets/mascot-joke.svg", alt: "הדמות צוחקת", button: "עוד בדיחה!" },
      error: { src: "assets/mascot-error.svg", alt: "הדמות מסוחררת", button: "לנסות שוב" },
    };

    function setState(state, text) {
      const { src, alt, button: label } = STATES[state];
      bubble.dataset.state = state;
      mascot.src = src;
      mascot.alt = alt;
      button.textContent = label;
      button.disabled = state === "think";
      message.textContent = text;
      laughButton.hidden = true;
      laughError.hidden = true;
    }

    // "צחקתי": רק לבדיחה שנשמרה ויש לה id
    const laughButton = document.getElementById("laugh");
    const laughError = document.getElementById("laugh-error");
    let currentId = null;

    function showLaugh(id) {
      currentId = id || null;
      laughButton.hidden = !currentId;
      laughButton.disabled = false;
      laughButton.classList.remove("done");
      laughButton.textContent = "צחקתי · 0";
    }

    laughButton.addEventListener("click", async () => {
      if (laughButton.disabled || !currentId) return;
      const id = currentId;
      laughButton.disabled = true;
      laughError.hidden = true;

      try {
        const response = await fetch("/api/laugh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const data = await response.json();
        if (id !== currentId) return; // בינתיים הגיעה בדיחה חדשה
        if (response.ok && typeof data.laughs === "number") {
          laughButton.classList.add("done");
          laughButton.textContent = `צחקתי · ${data.laughs}`;
          loadTop();
        } else {
          throw new Error(data.error);
        }
      } catch {
        if (id !== currentId) return;
        laughButton.disabled = false;
        laughError.textContent = "הצחוק לא נשמר. נסו שוב.";
        laughError.hidden = false;
      }
    });

    // "הכי מצחיקות": בפתיחת הדף ואחרי כל צחוק. בלי polling.
    const topList = document.getElementById("top-list");
    const topStatus = document.getElementById("top-status");

    async function loadTop() {
      try {
        const response = await fetch("/api/top");
        const data = await response.json();
        if (!response.ok || !Array.isArray(data.jokes)) throw new Error();

        topList.replaceChildren(...data.jokes.map((joke) => {
          const item = document.createElement("li");
          const text = document.createElement("p");
          text.className = "top-text";
          text.textContent = joke.text;
          const meta = document.createElement("p");
          meta.className = "top-meta";
          const laughs = joke.laughs === 1 ? "צחוק אחד" : `${joke.laughs} צחוקים`;
          meta.textContent = `${joke.topic || "בלי נושא"} · ${laughs}`;
          item.append(text, meta);
          return item;
        }));

        topStatus.hidden = data.jokes.length > 0;
        topStatus.textContent = "עוד אין כאן בדיחות. צחקו על בדיחה, והיא תופיע כאן.";
      } catch {
        topStatus.hidden = false;
        topStatus.textContent = "הרשימה לא נטענה כרגע.";
      }
    }

    loadTop();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      const topic = topicInput.value.trim();
      setState("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...");

      try {
        const response = await fetch("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        const data = await response.json();
        if (response.ok && data.joke) {
          setState("joke", data.joke);
          showLaugh(data.id);
        } else {
          setState("error", data.error || "משהו השתבש. נסו שוב.");
        }
      } catch {
        setState("error", "אין חיבור לשרת. נסו שוב.");
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
